<text id="find-lane-title" fill="#6200ee" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="24" text-anchor="start"><tspan x="40" y="185.0">01  FIND &amp; STAGE  /  PETER LYNCH</tspan></text>
