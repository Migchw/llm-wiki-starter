<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1460" viewBox="0 0 1260 1460" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">/research: find, ingest, draft</title>
<desc id="svg-desc">Find and stage sources through Peter Lynch. Munger ingests usable sources one at a time with material fact and reasoning checks, maintaining linked knowledge. Draft only with sufficient reviewed Source Notes, an Entity and at least one Concept. Leopold drafts; Feynman and Reviewer check again. Failed review stays pending; only passing drafts become reviewed.</desc>
