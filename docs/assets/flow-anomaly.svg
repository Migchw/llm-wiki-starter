<title id="t">/anomaly-scan: odd moves become research tasks</title><desc id="d">anomaly_scan.py flags price and volume outliers, Munger explains them from the vault, sector and news, diffs the language of the two newest Source Notes, writes a report and queues follow-ups.</desc>
