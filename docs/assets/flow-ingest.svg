<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 356" width="1092" height="534" role="img" aria-labelledby="t d">
<title id="t">/ingest: one source, one pass</title><desc id="d">The user picks a source, fetch_source.py writes Raw, Munger writes the Source Note, links entities and selective concepts, then updates the queue and log and runs lint.</desc>
