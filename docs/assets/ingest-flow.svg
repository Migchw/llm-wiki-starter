<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1010" viewBox="0 0 1260 1010" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">/ingest: one source at a time</title>
<desc id="svg-desc">Standard single-source ingest runs directly in Munger: Python capture, Source Note, relevant Entity and selective Concept, Queue and Log. Larger research work uses Ingest Runner and specialist review. No supplied source selects the queue; multiple inputs are staged and prioritized. A completed queue item does not verify every claim.</desc>
<defs>
<marker id="arrow60646c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#60646c" stroke-width="1.5"/></marker>
<marker id="arrow6200ee" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#6200ee" stroke-width="1.5"/></marker>
<marker id="arrow007f75" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#007f75" stroke-width="1.5"/></marker>
<marker id="arrowb00020" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#b00020" stroke-width="1.5"/></marker>
</defs>
<rect x="1" y="1" width="1258" height="1008" rx="16" fill="#ffffff" stroke="#e4e5e7"/>
<text id="headline" fill="#222222" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="42" text-anchor="start"><tspan x="40" y="78.0">/ingest: one source at a time</tspan></text>
<text id="subtitle" fill="#60646c" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="24" text-anchor="start"><tspan x="40" y="122.0">Standard single-source route: Munger executes the lean pipeline directly.</tspan></text>
<text id="direct-head" fill="#6200ee" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="22" text-anchor="start"><tspan x="40" y="186.0">STANDARD / SINGLE SOURCE</tspan></text>
<rect id="capture" x="40" y="215" width="260" height="150" rx="10" fill="#f8f8f8" stroke="#b0b3b8" stroke-width="2"/>
<text id="capture-title" fill="#222222" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="29" text-anchor="start"><tspan x="60" y="262.0">Python capture</tspan></text>
<text id="capture-detail" fill="#60646c" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="22" text-anchor="start"><tspan x="60" y="302.0">01-Raw/</tspan></text>
<rect id="note" x="340" y="215" width="260" height="150" rx="10" fill="#f8f8f8" stroke="#6200ee" stroke-width="2"/>
<text id="note-title" fill="#222222" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="29" text-anchor="start"><tspan x="360" y="262.0">Source Note</tspan></text>
<text id="note-detail" fill="#60646c" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="22" text-anchor="start"><tspan x="360" y="302.0">Fact / interpretation</tspan><tspan x="360" y="329.5">Open question</tspan></text>
<polyline id="direct-1" points="300.0,290.0 334.0,290.0" fill="none" stroke="#60646c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow60646c)"/>
<rect id="linked" x="640" y="215" width="260" height="150" rx="10" fill="#f8f8f8" stroke="#b0b3b8" stroke-width="2"/>
<text id="linked-title" fill="#222222" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="29" text-anchor="start"><tspan x="660" y="262.0">Linked Wiki</tspan></text>
<text id="linked-detail" fill="#60646c" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="22" text-anchor="start"><tspan x="660" y="302.0">Entity + Concept*</tspan></text>
<polyline id="direct-2" points="600.0,290.0 634.0,290.0" fill="none" stroke="#60646c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow60646c)"/>
<rect id="done" x="940" y="215" width="260" height="150" rx="10" fill="#f8f8f8" stroke="#b0b3b8" stroke-width="2"/>
<text id="done-title" fill="#222222" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="29" text-anchor="start"><tspan x="960" y="262.0">Queue + Log</tspan></text>
<text id="done-detail" fill="#60646c" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="22" text-anchor="start"><tspan x="960" y="302.0">Source Note created</tspan></text>
<polyline id="direct-3" points="900.0,290.0 934.0,290.0" fill="none" stroke="#60646c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow60646c)"/>
<text id="input-note" fill="#60646c" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="22" text-anchor="start"><tspan x="40" y="423.0">Input: URL or file. No input: take a next P0/P1 queue item. Multiple sources: stage and prioritize.</tspan></text>
<text id="delegated-head" fill="#6200ee" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="22" text-anchor="start"><tspan x="40" y="507.0">LARGER WORK / RESEARCH</tspan></text>
<rect id="runner" x="40" y="536" width="270" height="145" rx="10" fill="#f8f8f8" stroke="#b0b3b8" stroke-width="2"/>
<text id="runner-title" fill="#222222" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="60" y="584.0">Ingest Runner</tspan></text>
<text id="runner-detail" fill="#60646c" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="22" text-anchor="start"><tspan x="60" y="623.0">One staged source</tspan></text>
<rect id="researcher" x="350" y="536" width="270" height="145" rx="10" fill="#f8f8f8" stroke="#b0b3b8" stroke-width="2"/>
<text id="researcher-title" fill="#222222" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="370" y="584.0">Researcher</tspan></text>
<text id="researcher-detail" fill="#60646c" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="22" text-anchor="start"><tspan x="370" y="623.0">Write Source Note</tspan></text>
<rect id="checks" x="660" y="536" width="270" height="145" rx="10" fill="#f8f8f8" stroke="#b0b3b8" stroke-width="2"/>
<text id="checks-title" fill="#222222" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="25" text-anchor="start"><tspan x="680" y="579.0">Feynman + Reviewer</tspan></text>
<text id="checks-detail" fill="#60646c" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="22" text-anchor="start"><tspan x="680" y="623.0">Material facts / logic</tspan></text>
<rect id="darwin" x="970" y="536" width="250" height="145" rx="10" fill="#f8f8f8" stroke="#b0b3b8" stroke-width="2"/>
<text id="darwin-title" fill="#222222" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="30" text-anchor="start"><tspan x="990" y="584.0">Darwin</tspan></text>
<text id="darwin-detail" fill="#60646c" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="22" text-anchor="start"><tspan x="990" y="623.0">Entity / Concept*</tspan></text>
<polyline id="runner-researcher" points="310.0,608.0 344.0,608.0" fill="none" stroke="#60646c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow60646c)"/>
<polyline id="researcher-checks" points="620.0,608.0 654.0,608.0" fill="none" stroke="#60646c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow60646c)"/>
<polyline id="checks-darwin" points="930.0,608.0 964.0,608.0" fill="none" stroke="#60646c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow60646c)"/>
<text id="video-title" fill="#222222" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="28" text-anchor="start"><tspan x="40" y="782.0">Video input</tspan></text>
<text id="video-body" fill="#60646c" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="24" text-anchor="start"><tspan x="40" y="824.0">Acquire an available transcript, then</tspan><tspan x="40" y="854.0">use the same Raw-to-Source-Note path.</tspan></text>
<text id="status-title" fill="#222222" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="28" text-anchor="start"><tspan x="660" y="782.0">Completion is not verification</tspan></text>
<text id="status-body" fill="#60646c" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="24" text-anchor="start"><tspan x="660" y="824.0">Queue done means a Source Note exists.</tspan><tspan x="660" y="854.0">Unchecked claims remain pending.</tspan></text>
<text id="concept-note" fill="#60646c" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="22" text-anchor="start"><tspan x="40" y="951.0">*Create Concepts only for durable, reusable ideas. Preserve links back to source evidence.</tspan></text>
<text id="captionless" fill="#60646c" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="22" text-anchor="start"><tspan x="40" y="992.0">If no transcript is available, obtain usable source text before continuing.</tspan></text>
</svg>
