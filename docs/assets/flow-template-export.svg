<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 356" width="1092" height="534" role="img" aria-labelledby="t d">
<title id="t">/template-export: private vault to public template</title><desc id="d">The owner commits framework changes, export_template.py copies them onto upstream/master in a worktree, resets personal data and runs a leak check, the build and tests run, and the owner approves before a pull request to the public template.</desc>
<style>
  text { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; }
  .num { fill: #2d3142; font-size: 7px; font-weight: 600; }
  .step { fill: #4f5d75; font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
  .lane { fill: #4f5d75; font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
  .role { fill: #2d3142; font-size: 6px; font-weight: 600; }
  .title { fill: #2d3142; font: 600 9px 'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .sub { fill: #4f5d75; font-size: 6.5px; }
  .tool { fill: #7a8399; font-size: 6.5px; }
  .chip { fill: #fff; font-size: 5px; font-weight: 700; }
  .alabel { font-size: 7.5px; letter-spacing: 0.06em; }
  .focal { fill: #eb6c36; }
  .cut { fill: #b85450; }
  .lg { fill: #4f5d75; font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
  .lt { fill: #4f5d75; font: 400 7px 'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; text-anchor: start; }
</style>
