<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1030" viewBox="0 0 1260 1030" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Knowledge ingestion &amp; synthesis</title>
<desc id="svg-desc">A research source is triaged, prioritized, captured into Raw, and distilled into a Source Note. Research reviews material claims before linking Entities and selective Concepts; unresolved claims stay pending for revision. Standard single-source ingest has a separate lean route, including items chosen from the queue. Index provides retrieval while Logs and Schema support the workflow.</desc>
