<title id="t">/research TICKER: find, ingest, check what the thesis uses, draft</title><desc id="d">Munger asks for user sources, Peter Lynch finds and stages filings, Munger ingests each one and Darwin extracts concepts, Feynman checks only the claims the thesis will use, Leopold drafts the thesis and Feynman plus Reviewer check the draft.</desc>
